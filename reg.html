<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — NOVA RP</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="https://jsdelivr.net"></script>

</head>

<body>

    <!-- Наша живая атласная вуаль на фоне -->
    <div class="space-veil">
        <div class="nebula-cloud cloud-1"></div>
        <div class="nebula-cloud cloud-2"></div>
        <div class="nebula-cloud cloud-3"></div>
    </div>

    <!-- Шапка сайта -->
    <header>
        <div class="logo">NOVA <span>RP</span></div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="rules.html">Правила</a>
            <a href="jobs.html">Профессии</a>
            <a href="donate.html">Донат</a>
            <a href="team.html">Команда</a>
            <a href="faq.html">FAQ</a>
            <button class="btn-login" id="nav-login-btn" onclick="handleLoginClick()">Вход</button>
        </nav>
    </header>

    <!-- Основной контейнер центрирования формы -->
    <div class="login-wrapper">
        <div class="login-card">
            <h1>Регистрация</h1>
            
            <form action="#" method="POST">
                <!-- Поле: Логин -->
                <div class="input-group">
                    <label for="username">Игровой Логин</label>
                    <input type="text" id="username" name="username" placeholder="Придумайте логин" required>
                </div>

                <!-- Поле: Email -->
                <div class="input-group">
                    <label for="email">E-mail адрес</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                </div>

                <!-- Поле: Пароль -->
                <div class="input-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Создайте сложный пароль" required>
                </div>

                <!-- Поле: Повтор пароля -->
                <div class="input-group">
                    <label for="password_confirm">Повторите пароль</label>
                    <input type="password" id="password_confirm" name="password_confirm" placeholder="Введите пароль еще раз" required>
                </div>

                <!-- Кнопка создания аккаунта (использует стили кнопок .btn и .btn-primary) -->
                <button type="submit" class="btn btn-primary login-btn-wide">Создать аккаунт</button>
            </form>

            <!-- Ссылка на возврат к авторизации -->
            <div class="login-footer-links">
                Уже есть аккаунт? <a href="login.html">Войти в аккаунт</a>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Supabase
        const SUPABASE_URL = "https://xucgexdpbjxrszxzmoti.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_luFbMKTfqpKCNqzT4Zy3CA_uFE8ucva"; // Замените на ваш ключ!
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Логика работы формы входа
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Вход в систему через Supabase
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert("Ошибка входа: " + error.message);
            } else {
                alert("Вы успешно вошли в аккаунт!");
                window.location.href = "profile.html"; // Перенаправляем в личный кабинет
            }
        });
    </script>

    <!-- Подвал сайта из вашего CSS -->
    <footer>
        <div class="footer-grid">
            <div class="footer-col">
                <div class="footer-logo">NOVA <span>RP</span></div>
                <p class="footer-desc">Игровой проект в Garry's Mod</p>
            </div>
            <div class="footer-col">
                <h4>Документы</h4>
                <a href="terms.pdf">Пользовательское соглашение</a>
                <a href="privacy.pdf">Политика конфиденциальности</a>
            </div>
            <div class="footer-col">
                <h4>Поддержка</h4>
                <a href="mailto:novarpgmod.support@gmail.com">novarpgmod.support@gmail.com</a>
                <a href="faq.html">FAQ</a>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 NOVA RP. Все права защищены.
        </div>
    </footer>

    <script src="auth-check.js"></script>

</body>
</html>
