<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль | NOVA RP</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="space-veil">
        <div class="nebula-cloud cloud-1"></div>
        <div class="nebula-cloud cloud-2"></div>
    </div>

    <header>
        <div class="logo"><a href="index.html">NOVA <span>RP</span></a></div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="rules.html">Правила</a>
            <a href="jobs.html">Профессии</a>
            <a href="donate.html">Донат</a>
            <a href="team.html">Команда</a>
            <a href="faq.html">FAQ</a>

            <button class="btn-login" id="nav-login-btn">Вход</button>
        </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Новый пароль</h2>
                <p>Придумайте новый пароль для вашего аккаунта</p>
            </div>

            <form class="auth-form" id="update-form">
                <div class="form-group">
                    <label for="new-password">Новый пароль</label>
                    <input type="password" id="new-password" class="form-input" placeholder="Минимум 8 символов" required autocomplete="new-password" minlength="8">
                </div>

                <div class="form-group">
                    <label for="confirm-new-password">Повторите пароль</label>
                    <input type="password" id="confirm-new-password" class="form-input" placeholder="Введите пароль ещё раз" required autocomplete="new-password" minlength="8">
                </div>

                <button type="submit" class="btn btn-primary">Сохранить пароль</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-grid">
            <div class="footer-col">
                <div class="footer-logo">NOVA <span>RP</span></div>
                <p class="footer-desc">Игровой проект в Garry's Mod</p>
            </div>
            <div class="footer-col">
                <h4>Документы</h4>
                <a href="terms.pdf">Пользовательское соглашение</a>
                <a href="privacy.pdf">Политика конфиденциальности</a>
            </div>
            <div class="footer-col">
                <h4>Поддержка</h4>
                <a href="mailto:novarpgmod.support@gmail.com">novarpgmod.support@gmail.com</a>
                <a href="faq.html">FAQ</a>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 NOVA RP. Все права защищены.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth-check.js"></script>

    <script>
        // Проверяем, есть ли сессия от ссылки сброса
        async function checkResetSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert('Ссылка для сброса пароля недействительна или устарела. Запросите новую.');
                window.location.href = 'reset.html';
                return false;
            }
            return true;
        }

        document.getElementById('update-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-new-password').value;
            const submitBtn = this.querySelector('button[type="submit"]');

            if (newPassword !== confirmPassword) {
                alert('Пароли не совпадают!');
                return;
            }

            if (newPassword.length < 8) {
                alert('Пароль должен быть минимум 8 символов');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Сохранение...';

            const { error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                alert('Ошибка: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Сохранить пароль';
                return;
            }

            alert('Пароль успешно обновлён! Сейчас перенаправим вас в профиль.');
            window.location.href = 'profile.html';
        });

        // Проверяем сессию при загрузке
        window.addEventListener('DOMContentLoaded', checkResetSession);
    </script>

</body>
</html>
