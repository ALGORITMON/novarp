<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

<body>

    <!-- Наша живая атласная вуаль на фоне -->
    <div class="space-veil">
        <div class="nebula-cloud cloud-1"></div>
        <div class="nebula-cloud cloud-2"></div>
        <div class="nebula-cloud cloud-3"></div>
    </div>

    <!-- Шапка сайта -->
    <header>
        <div class="logo">NOVA <span>RP</span></div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="rules.html">Правила</a>
            <a href="jobs.html">Профессии</a>
            <a href="donate.html">Донат</a>
            <a href="team.html">Команда</a>
            <a href="faq.html">FAQ</a>
            <button class="btn-login" id="nav-login-btn" onclick="handleLoginClick()">Вход</button>
        </nav>
    </header>

    <!-- Центрированный блок входа -->
    <div class="login-wrapper">
        <div class="login-card">
            <h1>Авторизация</h1>
            
            <form id="login-form">
                <div class="input-group">
                    <label>Логин или SteamID</label>
                    <input type="text" id="username" placeholder="Введите ваш логин" required autocomplete="off">
                </div>
                
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="password" placeholder="Введите ваш пароль" required>
                </div>

                <!-- ИСПРАВЛЕНО: тип кнопки изменен на обычный button, а функция вызывается через onclick -->
                <button type="submit" class="btn btn-primary login-btn-wide">Войти в аккаунт</button>
            </form>

            <div class="login-footer-links">
                Еще нет аккаунта? <a href="reg.html">Регистрация</a>
            </div>

        </div>
    </div>

    <script>
        // Инициализация Supabase
        const SUPABASE_URL = "https://xucgexdpbjxrszxzmoti.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_luFbMKTfqpKCNqzT4Zy3CA_uFE8ucva"; // Замените на ваш ключ!
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Логика работы формы
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const login = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password-confirm').value;

            // Проверяем совпадение паролей
            if (password !== passwordConfirm) {
                alert("Пароли не совпадают!");
                return;
            }

            // Регистрируем в Supabase
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        display_name: login // Сохраняем Игровой Логин внутри профиля
                    }
                }
            });

            if (error) {
                alert("Ошибка регистрации: " + error.message);
            } else {
                alert("Аккаунт успешно создан!");
                window.location.href = "profile.html"; // Перенаправляем в личный кабинет
            }
        });
    </script>

    <!-- Подвал сайта из вашего CSS -->
    <footer>

            <div class="footer-col">

            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 NOVA RP. Все права защищены.
        </div>
    </footer>

    <script>
        // Внутренняя функция шифрования
        async function getSHA256(text) {
            const msgBuffer = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Обычная функция для кнопки, которая сама вызывает шифрование
        function submitLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Запускаем шифрование и ждем результат
            getSHA256(pass).then(hashedPassword => { 
                
                const targetHash = "90ba9328b1e19a02ecfdf82a609a4c01a24402a570b761cbd7ccda2351d08e91";

                if (user === "admin" && hashedPassword === targetHash) {
                    localStorage.setItem('nova_admin_session', 'active');
                    alert("Успешный вход! Доступ к управлению сайтом разрешен.");
                    window.location.href = "index.html"; 
                } else {
                    alert("Неверный логин или пароль!");
                }
            }).catch(err => {
                console.error("Ошибка шифрования:", err);
                alert("Произошла ошибка при обработке пароля.");
            });
        }
    </script>

    <script src="auth-check.js"></script>

</body>
