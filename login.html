    <style>
        /* Уникальные стили для шикарного окна авторизации */
        .login-wrapper {
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(19, 9, 36, 0.6);
            backdrop-filter: blur(15px); /* Сильный эффект размытия заднего фона */
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px; /* Мягкие скругленные углы */
            padding: 45px 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 30px rgba(168, 85, 247, 0.15);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(168, 85, 247, 0.6);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.25);
        }

        .login-card h1 {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        /* Красивые кастомные инпуты */
        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            color: #8492a6;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: block;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            background: rgba(5, 2, 10, 0.7);
            border: 1px solid rgba(138, 92, 246, 0.25);
            padding: 14px 16px;
            color: #fff;
            font-size: 14px;
            border-radius: 6px;
            font-family: 'Nunito', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-group input:focus {
            outline: none;
            border-color: #a855f7;
            background: rgba(19, 9, 36, 0.8);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
        }

        /* Премиальная неоновая кнопка */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
            background: linear-gradient(135deg, #b96cfd 0%, #7579ff 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .login-footer {
            font-size: 13px;
            color: #4b5563;
            text-align: center;
            margin-top: 25px;
            font-weight: 600;
        }

        .login-footer span {
            color: #a855f7;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .login-footer span:hover {
            color: #fff;
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);

    <script>
    // Внутренняя функция шифрования
    async function getSHA256(text) {
        const msgBuffer = new TextEncoder().encode(text);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Обычная функция для кнопки, которая сама вызывает шифрование
    function submitLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // Запускаем шифрование и ждем результат
        getSHA256(pass).then(hashedPassword => { 
            
            const targetHash = "90ba9328b1e19a02ecfdf82a609a4c01a24402a570b761cbd7ccda2351d08e91";

            if (user === "admin" && hashedPassword === targetHash) {
                localStorage.setItem('nova_admin_session', 'active');
                alert("Успешный вход! Доступ к управлению сайтом разрешен.");
                window.location.href = "index.html"; 
            } else {
                alert("Неверный логин или пароль!");
            }
        }).catch(err => {
            console.error("Ошибка шифрования:", err);
            alert("Произошла ошибка при обработке пароля.");
        });
    }
</script>
