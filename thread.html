<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тема — NOVA RP</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="space-veil">
        <div class="nebula-cloud cloud-1"></div>
        <div class="nebula-cloud cloud-2"></div>
    </div>

    <header>
        <div class="logo"><a href="index.html">NOVA <span>RP</span></a></div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="rules.html">Правила</a>
            <a href="jobs.html">Профессии</a>
            <a href="donate.html">Донат</a>
            <a href="team.html">Команда</a>
            <a href="forum.html" class="active">Форум</a>
            <a href="faq.html">FAQ</a>
            <button class="btn-login" id="nav-login-btn">Вход</button>
        </nav>
    </header>

    <main class="forum-container">
        <div class="forum-breadcrumbs">
            <a href="forum.html">Форум</a>
            <span>›</span>
            <span id="breadcrumb-category">...</span>
        </div>

        <div id="thread-content">
            <div class="forum-empty">Загрузка...</div>
        </div>
    </main>

    <footer>
        <div class="footer-grid">
            <div class="footer-col">
                <div class="footer-logo">NOVA <span>RP</span></div>
                <p class="footer-desc">Игровой проект в Garry's Mod</p>
            </div>
            <div class="footer-col">
                <h4>Документы</h4>
                <a href="terms.pdf">Пользовательское соглашение</a>
                <a href="privacy.pdf">Политика конфиденциальности</a>
            </div>
            <div class="footer-col">
                <h4>Поддержка</h4>
                <a href="mailto:novarpgmod.support@gmail.com">novarpgmod.support@gmail.com</a>
                <a href="faq.html">FAQ</a>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 NOVA RP. Все права защищены.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth-check.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const threadId = urlParams.get('id');
        let currentUser = null;
        let currentProfile = null;
        let currentThread = null;
        let editingPostId = null;

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
            ));
        }

        function timeAgo(dateStr) {
            const date = new Date(dateStr);
            const diff = Math.floor((Date.now() - date.getTime()) / 1000);
            if (diff < 60) return 'только что';
            if (diff < 3600) return Math.floor(diff / 60) + ' мин. назад';
            if (diff < 86400) return Math.floor(diff / 3600) + ' ч. назад';
            if (diff < 2592000) return Math.floor(diff / 86400) + ' дн. назад';
            return date.toLocaleDateString('ru-RU');
        }

        function getInitials(nick) {
            return (nick || '?').substring(0, 2).toUpperCase();
        }

        function canModify(authorId) {
            if (!currentUser) return false;
            if (currentUser.id === authorId) return true;
            const role = currentProfile?.site_role;
            return role === 'admin' || role === 'mod';
        }

        function isModerator() {
            const role = currentProfile?.site_role;
            return role === 'admin' || role === 'mod';
        }

        async function init() {
            if (!threadId) {
                document.getElementById('thread-content').innerHTML = '<div class="forum-empty">Тема не найдена</div>';
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                const { data } = await supabaseClient
                    .from('profiles')
                    .select('username, site_role, avatar_url')
                    .eq('id', currentUser.id)
                    .single();
                currentProfile = data;
            }

            await loadThread();
        }

        async function loadThread() {
            const container = document.getElementById('thread-content');

            const { data: thread, error } = await supabaseClient
                .from('forum_threads')
                .select('*, forum_categories(slug, title, icon)')
                .eq('id', threadId)
                .single();

            if (error || !thread) {
                container.innerHTML = '<div class="forum-empty">Тема не найдена или удалена</div>';
                return;
            }

            currentThread = thread;

            await supabaseClient
                .from('forum_threads')
                .update({ views: (thread.views || 0) + 1 })
                .eq('id', threadId);

            document.getElementById('breadcrumb-category').textContent = thread.forum_categories?.title || 'Категория';

            const { data: posts } = await supabaseClient
                .from('forum_posts')
                .select('*')
                .eq('thread_id', threadId)
                .order('created_at');

            const canEditThread = canModify(thread.author_id);
            const canDeleteThread = canModify(thread.author_id);
            const canReply = currentUser && !thread.is_locked;
            const canLockThread = canModify(thread.author_id) || isModerator();
            const canPin = isModerator();

            container.innerHTML = `
                <div class="thread-header">
                    <h1>
                        ${thread.is_pinned ? '📌 ' : ''}
                        ${thread.is_locked ? '🔒 ' : ''}
                        ${escapeHtml(thread.title)}
                    </h1>
                    <div class="thread-header-info">
                        <span>Автор: <strong>${escapeHtml(thread.author_username)}</strong></span>
                        <span>${timeAgo(thread.created_at)}</span>
                        <span>👁 ${(thread.views || 0) + 1}</span>
                        <span>💬 ${posts?.length || 0}</span>
                        ${thread.is_locked ? '<span style="color: #f87171;">🔒 Тема закрыта</span>' : ''}
                    </div>

                    ${(canEditThread || canDeleteThread || canLockThread || canPin) ? `
                        <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                            ${canEditThread ? `<button class="btn btn-secondary" onclick="openEditThread()" style="font-size: 12px; padding: 8px 16px;">✏️ Редактировать</button>` : ''}
                            ${canLockThread ? `<button class="btn btn-secondary" onclick="toggleLock()" style="font-size: 12px; padding: 8px 16px;">${thread.is_locked ? '🔓 Открыть тему' : '🔒 Закрыть тему'}</button>` : ''}
                            ${canPin ? `<button class="btn btn-secondary" onclick="togglePin()" style="font-size: 12px; padding: 8px 16px;">${thread.is_pinned ? '📍 Открепить' : '📌 Закрепить'}</button>` : ''}
                            ${canDeleteThread ? `<button class="btn btn-secondary" onclick="openDeleteThreadModal()" style="font-size: 12px; padding: 8px 16px; color: #f87171;">🗑️ Удалить тему</button>` : ''}
                        </div>
                    ` : ''}
                </div>

                <div class="thread-posts">
                    <div class="post">
                        <div class="post-author">
                            ${thread.author_avatar
                                ? `<img src="${thread.author_avatar}" class="post-avatar" style="object-fit: cover;" alt="${escapeHtml(thread.author_username)}">`
                                : `<div class="post-avatar">${getInitials(thread.author_username)}</div>`}
                            <div class="post-author-info">
                                <h4>${escapeHtml(thread.author_username)}</h4>
                                <span>${timeAgo(thread.created_at)}</span>
                            </div>
                        </div>
                        <div class="post-content">${escapeHtml(thread.content)}</div>
                    </div>
                    ${(posts || []).map(p => renderPost(p)).join('')}
                </div>

                ${thread.is_locked 
                    ? '<div class="forum-empty">🔒 Тема закрыта. Новые ответы недоступны.</div>' 
                    : (canReply ? `
                        <div class="reply-form">
                            <h3>Ответить</h3>
                            <textarea id="reply-content" placeholder="Ваш ответ..." minlength="2"></textarea>
                            <button class="btn btn-primary" onclick="submitReply()" id="reply-submit">Отправить ответ</button>
                        </div>
                    ` : `
                        <div class="forum-empty"><a href="login.html">Войдите</a>, чтобы оставить ответ</div>
                    `)
                }
            `;
        }

        function renderPost(post) {
            const canEdit = canModify(post.author_id);
            const canDelete = canModify(post.author_id);

            const avatarHtml = post.author_avatar
                ? `<img src="${post.author_avatar}" class="post-avatar" style="object-fit: cover;" alt="${escapeHtml(post.author_username)}">`
                : `<div class="post-avatar">${getInitials(post.author_username)}</div>`;

            return `
                <div class="post">
                    <div class="post-author">
                        ${avatarHtml}
                        <div class="post-author-info">
                            <h4>${escapeHtml(post.author_username)}</h4>
                            <span>${timeAgo(post.created_at)}${post.updated_at !== post.created_at ? ' · изменено' : ''}</span>
                        </div>
                        ${(canEdit || canDelete) ? `
                            <div class="post-author-actions">
                                ${canEdit ? `<button class="admin-action-btn" onclick="openEditPost('${post.id}')" title="Редактировать">✏️</button>` : ''}
                                ${canDelete ? `<button class="admin-action-btn btn-danger" onclick="openDeletePostModal('${post.id}')" title="Удалить">🗑️</button>` : ''}
                            </div>
                        ` : ''}
                    </div>
                    <div class="post-content">${escapeHtml(post.content)}</div>
                </div>
            `;
        }

        // ============================================
        // МОДАЛЬНЫЕ ОКНА
        // ============================================

        function createModal(id, content) {
            // Удаляем старую, если есть
            const old = document.getElementById(id);
            if (old) old.remove();

            const modal = document.createElement('div');
            modal.id = id;
            modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-box">${content}</div>`;
            document.body.appendChild(modal);

            // Закрытие по клику вне
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal(id);
            });

            // Закрытие по Escape
            const escHandler = (e) => {
                if (e.key === 'Escape') {
                    closeModal(id);
                    document.removeEventListener('keydown', escHandler);
                }
            };
            document.addEventListener('keydown', escHandler);

            // Анимация появления
            requestAnimationFrame(() => modal.classList.add('active'));

            return modal;
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            if (!modal) return;
            modal.classList.remove('active');
            setTimeout(() => modal.remove(), 250);
        }

        // === РЕДАКТИРОВАНИЕ ТЕМЫ ===
        window.openEditThread = function () {
            const modal = createModal('edit-thread-modal', `
                <h3>✏️ Редактировать тему</h3>
                <label for="edit-thread-title">Заголовок</label>
                <input type="text" id="edit-thread-title" value="${escapeHtml(currentThread.title)}" minlength="5" maxlength="200">
                <label for="edit-thread-content">Текст</label>
                <textarea id="edit-thread-content">${escapeHtml(currentThread.content)}</textarea>
                <div class="modal-error" id="edit-thread-error"></div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal('edit-thread-modal')">Отмена</button>
                    <button class="btn btn-primary" id="edit-thread-save">Сохранить</button>
                </div>
            `);

            setTimeout(() => document.getElementById('edit-thread-title').focus(), 100);

            document.getElementById('edit-thread-save').addEventListener('click', async () => {
                const title = document.getElementById('edit-thread-title').value.trim();
                const content = document.getElementById('edit-thread-content').value.trim();
                const errorEl = document.getElementById('edit-thread-error');

                if (title.length < 5) { errorEl.textContent = 'Заголовок минимум 5 символов'; return; }
                if (content.length < 10) { errorEl.textContent = 'Текст минимум 10 символов'; return; }

                const btn = document.getElementById('edit-thread-save');
                btn.disabled = true;
                btn.textContent = 'Сохранение...';

                const { error } = await supabaseClient
                    .from('forum_threads')
                    .update({ title, content, updated_at: new Date().toISOString() })
                    .eq('id', threadId);

                if (error) {
                    errorEl.textContent = 'Ошибка: ' + error.message;
                    btn.disabled = false;
                    btn.textContent = 'Сохранить';
                    return;
                }

                window.location.reload();
            });
        };

        // === РЕДАКТИРОВАНИЕ ПОСТА ===
        window.openEditPost = async function (postId) {
            const contentEl = document.querySelector(`[onclick="openEditPost('${postId}')"]`)
                ?.closest('.post')?.querySelector('.post-content');

            const currentContent = contentEl?.textContent || '';

            const modal = createModal('edit-post-modal', `
                <h3>✏️ Редактировать ответ</h3>
                <label for="edit-post-content">Текст</label>
                <textarea id="edit-post-content">${escapeHtml(currentContent)}</textarea>
                <div class="modal-error" id="edit-post-error"></div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal('edit-post-modal')">Отмена</button>
                    <button class="btn btn-primary" id="edit-post-save">Сохранить</button>
                </div>
            `);

            setTimeout(() => document.getElementById('edit-post-content').focus(), 100);

            document.getElementById('edit-post-save').addEventListener('click', async () => {
                const content = document.getElementById('edit-post-content').value.trim();
                const errorEl = document.getElementById('edit-post-error');

                if (content.length < 2) { errorEl.textContent = 'Текст минимум 2 символа'; return; }

                const btn = document.getElementById('edit-post-save');
                btn.disabled = true;
                btn.textContent = 'Сохранение...';

                const { error } = await supabaseClient
                    .from('forum_posts')
                    .update({ content, updated_at: new Date().toISOString() })
                    .eq('id', postId);

                if (error) {
                    errorEl.textContent = 'Ошибка: ' + error.message;
                    btn.disabled = false;
                    btn.textContent = 'Сохранить';
                    return;
                }

                window.location.reload();
            });
        };

        // === УДАЛЕНИЕ ТЕМЫ ===
        window.openDeleteThreadModal = function () {
            createModal('delete-thread-modal', `
                <h3>🗑️ Удалить тему</h3>
                <p style="color: #c5c6c7; font-size: 15px; margin-bottom: 20px; line-height: 1.6;">
                    Вы уверены, что хотите удалить тему <strong style="color:#fff;">"${escapeHtml(currentThread.title)}"</strong>?<br>
                    <span style="color: #f87171;">Это действие необратимо.</span>
                </p>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal('delete-thread-modal')">Отмена</button>
                    <button class="btn" style="background:#ef4444; color:#fff;" id="delete-thread-confirm">Удалить</button>
                </div>
            `);

            document.getElementById('delete-thread-confirm').addEventListener('click', async () => {
                const btn = document.getElementById('delete-thread-confirm');
                btn.disabled = true;
                btn.textContent = 'Удаление...';

                const { error } = await supabaseClient
                    .from('forum_threads')
                    .delete()
                    .eq('id', threadId);

                if (error) {
                    alert('Ошибка: ' + error.message);
                    btn.disabled = false;
                    btn.textContent = 'Удалить';
                    return;
                }
                window.location.href = 'forum.html';
            });
        };

        // === УДАЛЕНИЕ ПОСТА ===
        window.openDeletePostModal = function (postId) {
            createModal('delete-post-modal', `
                <h3>🗑️ Удалить ответ</h3>
                <p style="color: #c5c6c7; font-size: 15px; margin-bottom: 20px; line-height: 1.6;">
                    Удалить этот ответ?<br>
                    <span style="color: #f87171;">Это действие необратимо.</span>
                </p>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal('delete-post-modal')">Отмена</button>
                    <button class="btn" style="background:#ef4444; color:#fff;" id="delete-post-confirm">Удалить</button>
                </div>
            `);

            document.getElementById('delete-post-confirm').addEventListener('click', async () => {
                const btn = document.getElementById('delete-post-confirm');
                btn.disabled = true;
                btn.textContent = 'Удаление...';

                const { error } = await supabaseClient
                    .from('forum_posts')
                    .delete()
                    .eq('id', postId);

                if (error) {
                    alert('Ошибка: ' + error.message);
                    btn.disabled = false;
                    btn.textContent = 'Удалить';
                    return;
                }
                window.location.reload();
            });
        };

        // === ЗАКРЫТИЕ / ОТКРЫТИЕ ТЕМЫ ===
        window.toggleLock = async function () {
            const newLockState = !currentThread.is_locked;
            const action = newLockState ? 'закрыть' : 'открыть';
            const confirmText = newLockState 
                ? 'Закрыть тему? Никто (включая вас) не сможет оставлять ответы.' 
                : 'Открыть тему? Пользователи снова смогут отвечать.';

            createModal('lock-modal', `
                <h3>${newLockState ? '🔒 Закрыть тему' : '🔓 Открыть тему'}</h3>
                <p style="color: #c5c6c7; font-size: 15px; margin-bottom: 20px; line-height: 1.6;">${confirmText}</p>
                <div class="modal-actions">
                    <button class="btn btn-secondary" onclick="closeModal('lock-modal')">Отмена</button>
                    <button class="btn btn-primary" id="lock-confirm">${newLockState ? 'Закрыть' : 'Открыть'}</button>
                </div>
            `);

            document.getElementById('lock-confirm').addEventListener('click', async () => {
                const btn = document.getElementById('lock-confirm');
                btn.disabled = true;
                btn.textContent = '...';

                const { error } = await supabaseClient
                    .from('forum_threads')
                    .update({ is_locked: newLockState, updated_at: new Date().toISOString() })
                    .eq('id', threadId);

                if (error) {
                    alert('Ошибка: ' + error.message);
                    btn.disabled = false;
                    btn.textContent = newLockState ? 'Закрыть' : 'Открыть';
                    return;
                }
                window.location.reload();
            });
        };

        // === ОТВЕТ В ТЕМЕ ===
        window.submitReply = async function () {
            if (!currentUser) { alert('Нужно войти в аккаунт'); return; }
            if (currentThread.is_locked) { alert('Тема закрыта, ответы недоступны'); return; }

            const content = document.getElementById('reply-content').value.trim();
            if (!content || content.length < 2) { alert('Введите текст ответа (минимум 2 символа)'); return; }

            const submitBtn = document.getElementById('reply-submit');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';

            const { error } = await supabaseClient
                .from('forum_posts')
                .insert({
                    thread_id: threadId,
                    author_id: currentUser.id,
                    author_username: currentProfile?.username || 'Аноним',
                    author_avatar: currentProfile?.avatar_url || null,   // ← добавить
                    content: content
                });

            if (error) {
                alert('Ошибка: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить ответ';
                return;
            }

            await supabaseClient
                .from('forum_threads')
                .update({
                    replies_count: (currentThread.replies_count || 0) + 1,
                    last_reply_at: new Date().toISOString(),
                    last_reply_username: currentProfile?.username || 'Аноним'
                })
                .eq('id', threadId);

            window.location.reload();
        };

        window.togglePin = async function () {
            const newPinState = !currentThread.is_pinned;
            const action = newPinState ? 'закрепить' : 'открепить';

            if (!confirm(`Вы уверены, что хотите ${action} тему?`)) return;

            const { error } = await supabaseClient
                .from('forum_threads')
                .update({ is_pinned: newPinState, updated_at: new Date().toISOString() })
                .eq('id', threadId);

            if (error) {
                alert('Ошибка: ' + error.message);
                return;
            }
            window.location.reload();
        };

        window.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
